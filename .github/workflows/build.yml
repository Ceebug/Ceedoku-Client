name: Build Ceedoku Client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - arch: x64
            filename: Ceedoku-Installer_Windows-x64.exe
          - arch: ia32
            filename: Ceedoku-Installer_Windows-x86.exe
          - arch: arm64
            filename: Ceedoku-Installer_Windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-builder --win nsis --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename installer
        shell: bash
        run: |
          mv dist/*.exe "dist/${{ matrix.filename }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.arch }}
          path: dist/${{ matrix.filename }}


  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: armv7l
            filename: Ceedoku-Installer_Linux-arm32.AppImage
          - arch: arm64
            filename: Ceedoku-Installer_Linux-arm64.AppImage
          - arch: x64
            filename: Ceedoku-Installer_Linux-x64.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-builder --linux AppImage --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename installer
        run: |
          mv dist/*.AppImage "dist/${{ matrix.filename }}"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Linux-${{ matrix.arch }}
          path: dist/${{ matrix.filename }}


  macos:
    name: macOS Universal
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-builder --mac dmg --universal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename installer
        run: |
          mv dist/*.dmg "dist/Ceedoku-Installer_MacOS-universal.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macOS-universal
          path: dist/Ceedoku-Installer_MacOS-universal.dmg


  package:
    name: Package installers
    runs-on: ubuntu-latest
    needs:
      - windows
      - linux
      - macos

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create ZIP
        run: |
          cd installers
          zip ../Ceedoku-Client.zip \
            Ceedoku-Installer_Linux-arm32.AppImage \
            Ceedoku-Installer_Linux-arm64.AppImage \
            Ceedoku-Installer_Linux-x64.AppImage \
            Ceedoku-Installer_MacOS-universal.dmg \
            Ceedoku-Installer_Windows-arm64.exe \
            Ceedoku-Installer_Windows-x64.exe \
            Ceedoku-Installer_Windows-x86.exe

      - name: Upload combined ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ceedoku-Client
          path: Ceedoku-Client.zip
